[project]
name = "tfh-ai-sales-dept"
version = "0.1.0"
description = "AI Sales Department for The Fulfillment House"
requires-python = ">=3.11"

dependencies = [
    "anthropic>=0.55.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "apify-client>=1.7.0",
    "rapidfuzz>=3.9.0",
    "pyyaml>=6.0",
    "dnspython>=2.6.0",
    "httpx>=0.27.0",
    "gspread>=6.1.0",              # Google Sheets
    "google-auth>=2.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
