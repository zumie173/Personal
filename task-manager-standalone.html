<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useReducer, useEffect, useContext, createContext, useMemo, useRef } = React;

    /* ── UUID ── */
    function uuidv4() {
      return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
    }

    /* ── DATE UTILS ── */
    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function parseDate(iso) { const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
    function dateToISO(date) {
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }
    function formatDisplay(iso) { return iso ? parseDate(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : null; }
    function formatFull(iso) { return iso ? parseDate(iso).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}) : null; }
    function formatMonthYear(d) { return d.toLocaleDateString('en-US',{month:'long',year:'numeric'}); }
    function dueDateStatus(iso) {
      if (!iso) return 'none';
      const today = todayStr();
      if (iso === today) return 'today';
      if (iso < today) return 'overdue';
      const diff = Math.ceil((parseDate(iso) - new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())) / 86400000);
      return diff <= 7 ? 'this-week' : 'future';
    }
    function isOverdue(iso) { return dueDateStatus(iso) === 'overdue'; }
    function calSOM(d) { return new Date(d.getFullYear(),d.getMonth(),1); }
    function calEOM(d) { return new Date(d.getFullYear(),d.getMonth()+1,0); }
    function calSOW(d) { const r=new Date(d); r.setDate(r.getDate()-r.getDay()); return r; }
    function calEOW(d) { const r=new Date(d); r.setDate(r.getDate()+(6-r.getDay())); return r; }
    function calEachDay(s,e) {
      const days=[],cur=new Date(s); cur.setHours(0,0,0,0);
      const end=new Date(e); end.setHours(0,0,0,0);
      while(cur<=end){days.push(new Date(cur));cur.setDate(cur.getDate()+1);}
      return days;
    }
    function calSameMonth(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth();}
    function calIsToday(d){const t=new Date();return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()&&d.getDate()===t.getDate();}
    function calAddMonths(d,n){const r=new Date(d);r.setMonth(r.getMonth()+n);return r;}
    function calDIM(d){return new Date(d.getFullYear(),d.getMonth()+1,0).getDate();}

    /* ── COLORS ── */
    const PALETTE=[
      {bg:'#dbeafe',text:'#1e40af',border:'#93c5fd'},{bg:'#dcfce7',text:'#166534',border:'#86efac'},
      {bg:'#fef3c7',text:'#92400e',border:'#fcd34d'},{bg:'#fce7f3',text:'#9d174d',border:'#f9a8d4'},
      {bg:'#ede9fe',text:'#5b21b6',border:'#c4b5fd'},{bg:'#ffedd5',text:'#9a3412',border:'#fdba74'},
      {bg:'#cffafe',text:'#164e63',border:'#67e8f9'},{bg:'#f0fdf4',text:'#14532d',border:'#4ade80'},
      {bg:'#fdf4ff',text:'#6b21a8',border:'#d8b4fe'},{bg:'#fee2e2',text:'#991b1b',border:'#fca5a5'},
      {bg:'#f1f5f9',text:'#334155',border:'#94a3b8'},{bg:'#ecfdf5',text:'#065f46',border:'#6ee7b7'},
      {bg:'#fef9c3',text:'#713f12',border:'#fde047'},{bg:'#e0f2fe',text:'#0c4a6e',border:'#7dd3fc'},
    ];
    const _cm={};
    function getColor(key){if(!_cm[key])_cm[key]=PALETTE[Object.keys(_cm).length%PALETTE.length];return _cm[key];}

    /* ── DEFAULT DATA ── */
    const DEFAULT_CATS=['Accounting','Building / Construction','Capital Campaign','CARF','Day Hab','DMH','Fulfillment','Printing','Misc / Non-FH Tasks','Recommerce'];
    const DEFAULT_COMS=['Safety Committee','Finance Committee','GOAD Committee','Governance / Compensation Committee'];
    function buildDefaultEvents() {
      const yr=new Date().getFullYear();
      return [
        {c:'Safety Committee',t:'Annual Safety Training Review',m:1,d:15},
        {c:'Safety Committee',t:'Q1 Safety Walkthrough',m:3,d:15},
        {c:'Safety Committee',t:'Mid-Year Incident Report',m:6,d:15},
        {c:'Safety Committee',t:'Q3 Safety Walkthrough',m:9,d:15},
        {c:'Safety Committee',t:'Annual Safety Plan Update',m:11,d:15},
        {c:'Finance Committee',t:'Budget Review — Prior Year Close',m:1,d:20},
        {c:'Finance Committee',t:'Q1 Financial Review',m:3,d:20},
        {c:'Finance Committee',t:'Mid-Year Forecast',m:6,d:20},
        {c:'Finance Committee',t:'Q3 Financial Review',m:9,d:20},
        {c:'Finance Committee',t:'Budget Planning — Next Year',m:11,d:20},
        {c:'GOAD Committee',t:'Annual Goals Setting Session',m:2,d:10},
        {c:'GOAD Committee',t:'Mid-Year Goals Check-in',m:5,d:10},
        {c:'GOAD Committee',t:'Progress Review',m:8,d:10},
        {c:'GOAD Committee',t:'Year-End Assessment',m:11,d:10},
        {c:'Governance / Compensation Committee',t:'Annual Governance Review',m:1,d:25},
        {c:'Governance / Compensation Committee',t:'Compensation Benchmarking',m:4,d:25},
        {c:'Governance / Compensation Committee',t:'Policy Review',m:7,d:25},
        {c:'Governance / Compensation Committee',t:'Board Support Prep',m:10,d:25},
        {c:'Governance / Compensation Committee',t:'Year-End Governance Report',m:12,d:25},
      ].map(e=>({id:uuidv4(),committee:e.c,title:e.t,notes:'',done:false,
        date:`${yr}-${String(e.m).padStart(2,'0')}-${String(e.d).padStart(2,'0')}`}));
    }
    function buildInitialState(){return{tasks:[],committeeEvents:buildDefaultEvents(),categories:[...DEFAULT_CATS],committees:[...DEFAULT_COMS]};}

    /* ── STORE ── */
    const STORAGE_KEY='taskmanager_data';
    function loadState(){try{const r=localStorage.getItem(STORAGE_KEY);if(r)return JSON.parse(r);}catch{}return buildInitialState();}
    function reducer(state,action){
      switch(action.type){
        case 'ADD_TASK': return{...state,tasks:[...state.tasks,{id:uuidv4(),title:action.payload.title,category:action.payload.category||state.categories[0]||'',priority:action.payload.priority||'normal',dueDate:action.payload.dueDate||null,notes:action.payload.notes||'',done:false,addedToMyDay:false,myDayDate:null,createdAt:new Date().toISOString(),completedAt:null}]};
        case 'UPDATE_TASK': return{...state,tasks:state.tasks.map(t=>t.id===action.payload.id?{...t,...action.payload}:t)};
        case 'DELETE_TASK': return{...state,tasks:state.tasks.filter(t=>t.id!==action.payload)};
        case 'TOGGLE_TASK_DONE': return{...state,tasks:state.tasks.map(t=>t.id===action.payload?{...t,done:!t.done,completedAt:!t.done?new Date().toISOString():null}:t)};
        case 'ADD_TO_MY_DAY': return{...state,tasks:state.tasks.map(t=>t.id===action.payload?{...t,addedToMyDay:true,myDayDate:todayStr()}:t)};
        case 'REMOVE_FROM_MY_DAY': return{...state,tasks:state.tasks.map(t=>t.id===action.payload?{...t,addedToMyDay:false,myDayDate:null}:t)};
        case 'ADD_COMMITTEE_EVENT': return{...state,committeeEvents:[...state.committeeEvents,{id:uuidv4(),committee:action.payload.committee,title:action.payload.title,date:action.payload.date,notes:action.payload.notes||'',done:false}]};
        case 'UPDATE_COMMITTEE_EVENT': return{...state,committeeEvents:state.committeeEvents.map(e=>e.id===action.payload.id?{...e,...action.payload}:e)};
        case 'DELETE_COMMITTEE_EVENT': return{...state,committeeEvents:state.committeeEvents.filter(e=>e.id!==action.payload)};
        case 'TOGGLE_EVENT_DONE': return{...state,committeeEvents:state.committeeEvents.map(e=>e.id===action.payload?{...e,done:!e.done}:e)};
        case 'ADD_CATEGORY': return state.categories.includes(action.payload)?state:{...state,categories:[...state.categories,action.payload]};
        case 'DELETE_CATEGORY': return state.tasks.some(t=>t.category===action.payload)?state:{...state,categories:state.categories.filter(c=>c!==action.payload)};
        case 'ADD_COMMITTEE': return state.committees.includes(action.payload)?state:{...state,committees:[...state.committees,action.payload]};
        case 'DELETE_COMMITTEE': return state.committeeEvents.some(e=>e.committee===action.payload)?state:{...state,committees:state.committees.filter(c=>c!==action.payload)};
        case 'IMPORT_DATA': return action.payload;
        case 'CLEAR_DATA': return buildInitialState();
        default: return state;
      }
    }
    const StoreCtx=createContext(null);
    function StoreProvider({children}){
      const [state,dispatch]=useReducer(reducer,null,loadState);
      useEffect(()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch{}},[state]);
      return <StoreCtx.Provider value={{state,dispatch}}>{children}</StoreCtx.Provider>;
    }
    function useStore(){return useContext(StoreCtx);}

    /* ── SHARED COMPONENTS ── */
    function CategoryBadge({category}){
      if(!category)return null;
      const c=getColor(category);
      return <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium whitespace-nowrap" style={{backgroundColor:c.bg,color:c.text,border:`1px solid ${c.border}`}}>{category}</span>;
    }

    function TaskModal({task,onClose}){
      const{state,dispatch}=useStore();
      const isEdit=!!task;
      const[form,setForm]=useState({title:task?.title||'',category:task?.category||state.categories[0]||'',priority:task?.priority||'normal',dueDate:task?.dueDate||'',notes:task?.notes||''});
      const[err,setErr]=useState('');
      useEffect(()=>{const h=e=>{if(e.key==='Escape')onClose();};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);},[]);
      function submit(e){
        e.preventDefault();
        if(!form.title.trim()){setErr('Title is required');return;}
        const p={...form,dueDate:form.dueDate||null};
        if(isEdit)dispatch({type:'UPDATE_TASK',payload:{...task,...p}});
        else dispatch({type:'ADD_TASK',payload:p});
        onClose();
      }
      return(
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40" onClick={e=>e.target===e.currentTarget&&onClose()}>
          <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg mx-4">
            <div className="flex items-center justify-between px-6 py-4 border-b">
              <h2 className="text-lg font-semibold text-gray-900">{isEdit?'Edit Task':'New Task'}</h2>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl leading-none">×</button>
            </div>
            <form onSubmit={submit} className="px-6 py-5 space-y-4">
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">Title *</label>
                <input autoFocus type="text" className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="Task title"/>
                {err&&<p className="text-red-500 text-xs mt-1">{err}</p>}
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Category</label>
                  <select className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
                    {state.categories.map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                  <select className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value={form.priority} onChange={e=>setForm(f=>({...f,priority:e.target.value}))}>
                    <option value="high">High</option><option value="normal">Normal</option><option value="low">Low</option>
                  </select>
                </div>
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">Due Date</label>
                <input type="date" className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value={form.dueDate} onChange={e=>setForm(f=>({...f,dueDate:e.target.value}))}/>
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                <textarea rows={3} className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Optional notes…"/>
              </div>
              <div className="flex justify-end gap-3 pt-1">
                <button type="button" onClick={onClose} className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg">Cancel</button>
                <button type="submit" className="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">{isEdit?'Save Changes':'Add Task'}</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function TaskRow({task,onEdit,showMyDay=true}){
      const{dispatch}=useStore();
      const today=todayStr();
      const isMyDay=task.addedToMyDay&&task.myDayDate===today;
      const s=dueDateStatus(task.dueDate);
      const dc=s==='overdue'?'text-red-600 font-medium':s==='today'?'text-amber-600 font-medium':'text-gray-400';
      const dl=s==='today'?'Today':task.dueDate?formatDisplay(task.dueDate):null;
      return(
        <div className={`flex items-center gap-2 px-4 py-3 hover:bg-gray-50 border-b border-gray-100 group ${task.done?'opacity-60':''}`}>
          <input type="checkbox" checked={task.done} onChange={()=>dispatch({type:'TOGGLE_TASK_DONE',payload:task.id})} className="w-4 h-4 rounded border-gray-300 text-blue-600 cursor-pointer flex-shrink-0"/>
          <span className={`flex-1 text-sm min-w-0 truncate ${task.done?'line-through text-gray-400':'text-gray-900'}`}>{task.title}</span>
          {task.priority==='high'&&!task.done&&<span className="w-2 h-2 rounded-full bg-red-500 flex-shrink-0" title="High"/>}
          <CategoryBadge category={task.category}/>
          {dl&&<span className={`text-xs flex-shrink-0 ${dc}`}>{s==='overdue'&&'⚠ '}{dl}</span>}
          <div className="flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
            {showMyDay&&!isMyDay&&<button title="Add to My Day" onClick={()=>dispatch({type:'ADD_TO_MY_DAY',payload:task.id})} className="p-1 text-gray-400 hover:text-amber-500 rounded">☀</button>}
            {isMyDay&&<button title="In My Day" onClick={()=>dispatch({type:'REMOVE_FROM_MY_DAY',payload:task.id})} className="p-1 text-amber-500 rounded">☀</button>}
            <button title="Edit" onClick={()=>onEdit(task)} className="p-1 text-gray-400 hover:text-blue-600 rounded">✏</button>
            <button title="Delete" onClick={()=>{if(window.confirm('Delete this task?'))dispatch({type:'DELETE_TASK',payload:task.id});}} className="p-1 text-gray-400 hover:text-red-600 rounded">🗑</button>
          </div>
        </div>
      );
    }

    function Sidebar({view,setView}){
      const{state}=useStore();
      const today=todayStr();
      const cnt=state.tasks.filter(t=>t.addedToMyDay&&t.myDayDate===today&&!t.done).length;
      const NAV=[{id:'myday',label:'My Day',icon:'☀️'},{id:'alltasks',label:'All Tasks',icon:'📋'},{id:'categories',label:'Categories',icon:'🗂️'},{id:'committees',label:'Committees',icon:'👥'},{id:'gantt',label:'Calendar / Gantt',icon:'📅'},{id:'settings',label:'Settings',icon:'⚙️'}];
      return(
        <aside className="w-52 shrink-0 bg-gray-900 text-white flex flex-col h-screen sticky top-0">
          <div className="px-4 py-5 border-b border-gray-700"><h1 className="text-base font-bold text-white">Task Manager</h1></div>
          <nav className="flex-1 py-3">
            {NAV.map(item=>(
              <button key={item.id} onClick={()=>setView(item.id)} className={`w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium transition-colors ${view===item.id?'bg-blue-600 text-white':'text-gray-300 hover:bg-gray-700 hover:text-white'}`}>
                <span>{item.icon}</span>
                <span className="flex-1 text-left">{item.label}</span>
                {item.id==='myday'&&cnt>0&&<span className="bg-blue-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">{cnt}</span>}
              </button>
            ))}
          </nav>
          <div className="px-4 py-3 border-t border-gray-700 text-xs text-gray-500">Press N for new task</div>
        </aside>
      );
    }
    /* ── MY DAY ── */
    function MyDayRow({task,dispatch}){
      const s=dueDateStatus(task.dueDate);
      const dc=s==='overdue'?'text-red-600':s==='today'?'text-amber-600':'text-gray-400';
      const dl=s==='today'?'Today':task.dueDate?formatDisplay(task.dueDate):null;
      return(
        <div className={`flex items-center gap-3 px-4 py-3 border-b border-gray-100 last:border-0 group ${task.done?'bg-gray-50':''}`}>
          <input type="checkbox" checked={task.done} onChange={()=>dispatch({type:'TOGGLE_TASK_DONE',payload:task.id})} className="w-4 h-4 rounded border-gray-300 text-blue-600 cursor-pointer flex-shrink-0"/>
          <span className={`flex-1 text-sm ${task.done?'line-through text-gray-400':'text-gray-900'}`}>{task.title}</span>
          {task.priority==='high'&&!task.done&&<span className="w-2 h-2 rounded-full bg-red-500 flex-shrink-0"/>}
          <CategoryBadge category={task.category}/>
          {dl&&<span className={`text-xs flex-shrink-0 ${dc}`}>{s==='overdue'&&'⚠ '}{dl}</span>}
          <button onClick={()=>dispatch({type:'REMOVE_FROM_MY_DAY',payload:task.id})} title="Remove from My Day" className="text-gray-300 hover:text-red-400 opacity-0 group-hover:opacity-100 text-xl leading-none flex-shrink-0">×</button>
        </div>
      );
    }

    function MyDay(){
      const{state,dispatch}=useStore();
      const today=todayStr();
      const[search,setSearch]=useState('');
      const myDay=state.tasks.filter(t=>t.addedToMyDay&&t.myDayDate===today);
      const open=myDay.filter(t=>!t.done);
      const done=myDay.filter(t=>t.done);
      const eligible=state.tasks.filter(t=>!t.addedToMyDay||t.myDayDate!==today);
      const filtered=search.trim()?eligible.filter(t=>t.title.toLowerCase().includes(search.toLowerCase())||t.category.toLowerCase().includes(search.toLowerCase())):eligible;
      const byCategory=filtered.reduce((acc,t)=>{if(!acc[t.category])acc[t.category]=[];acc[t.category].push(t);return acc;},{});
      return(
        <div className="flex-1 p-6 max-w-3xl mx-auto w-full">
          <div className="mb-6">
            <h2 className="text-2xl font-bold text-gray-900">{formatFull(today)}</h2>
            {myDay.length>0&&<p className="text-sm text-gray-500 mt-1">{done.length} of {myDay.length} tasks done</p>}
          </div>
          {myDay.length===0?(
            <div className="text-center py-12 text-gray-400 border-2 border-dashed border-gray-200 rounded-xl mb-8">
              <div className="text-5xl mb-3">☀️</div>
              <p className="font-medium text-gray-500">Nothing on your list for today.</p>
              <p className="text-sm">Add tasks below to get started.</p>
            </div>
          ):(
            <div className="mb-8 rounded-xl border border-gray-200 overflow-hidden">
              {open.map(t=><MyDayRow key={t.id} task={t} dispatch={dispatch}/>)}
              {done.length>0&&<>
                <div className="px-4 py-2 bg-gray-50 border-t border-gray-100 text-xs font-medium text-gray-400 uppercase tracking-wide">Completed</div>
                {done.map(t=><MyDayRow key={t.id} task={t} dispatch={dispatch}/>)}
              </>}
            </div>
          )}
          <div className="border-t border-gray-200 pt-6">
            <h3 className="text-sm font-semibold text-gray-700 mb-3">Add tasks to My Day</h3>
            <input type="text" placeholder="Search tasks…" className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500" value={search} onChange={e=>setSearch(e.target.value)}/>
            {eligible.length===0?<p className="text-sm text-gray-400 text-center py-4">All tasks are already in My Day.</p>
            :filtered.length===0?<p className="text-sm text-gray-400 text-center py-4">No tasks match.</p>
            :(
              <div className="space-y-4">
                {Object.entries(byCategory).map(([cat,tasks])=>(
                  <div key={cat}>
                    <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">{cat}</div>
                    <div className="rounded-xl border border-gray-200 overflow-hidden">
                      {tasks.map(t=>(
                        <button key={t.id} onClick={()=>dispatch({type:'ADD_TO_MY_DAY',payload:t.id})} className="w-full flex items-center gap-3 px-4 py-2.5 hover:bg-blue-50 border-b border-gray-100 last:border-0 text-left group">
                          <span className={`flex-1 text-sm ${t.done?'line-through text-gray-400':'text-gray-800'}`}>{t.title}</span>
                          {t.dueDate&&<span className="text-xs text-gray-400">{formatDisplay(t.dueDate)}</span>}
                          {t.priority==='high'&&<span className="w-1.5 h-1.5 rounded-full bg-red-500"/>}
                          <span className="text-blue-500 text-xs opacity-0 group-hover:opacity-100">+ Add</span>
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ── ALL TASKS ── */
    function AllTasks({initialCategory}){
      const{state}=useStore();
      const[modal,setModal]=useState(null);
      const[grouped,setGrouped]=useState(false);
      const[filters,setFilters]=useState({status:'open',priority:'all',due:'all',category:initialCategory||'all'});
      const[sort,setSort]=useState('dueDate');
      const filtered=useMemo(()=>{
        let tasks=state.tasks.filter(t=>{
          if(filters.status==='open'&&t.done)return false;
          if(filters.status==='done'&&!t.done)return false;
          if(filters.priority!=='all'&&t.priority!==filters.priority)return false;
          if(filters.category!=='all'&&t.category!==filters.category)return false;
          if(filters.due!=='all'){
            const s=dueDateStatus(t.dueDate);
            if(filters.due==='overdue'&&s!=='overdue')return false;
            if(filters.due==='today'&&s!=='today')return false;
            if(filters.due==='this-week'&&!['today','this-week'].includes(s))return false;
            if(filters.due==='none'&&t.dueDate)return false;
          }
          return true;
        });
        return tasks.sort((a,b)=>{
          if(sort==='dueDate'){if(!a.dueDate&&!b.dueDate)return 0;if(!a.dueDate)return 1;if(!b.dueDate)return -1;return a.dueDate.localeCompare(b.dueDate);}
          if(sort==='created')return b.createdAt.localeCompare(a.createdAt);
          if(sort==='priority'){const p={high:0,normal:1,low:2};return p[a.priority]-p[b.priority];}
          if(sort==='alpha')return a.title.localeCompare(b.title);
          return 0;
        });
      },[state.tasks,filters,sort]);
      const byCategory=useMemo(()=>{
        if(!grouped)return null;
        return filtered.reduce((acc,t)=>{if(!acc[t.category])acc[t.category]=[];acc[t.category].push(t);return acc;},{});
      },[filtered,grouped]);
      return(
        <div className="flex-1 p-6">
          {modal&&<TaskModal task={modal==='new'?null:modal} onClose={()=>setModal(null)}/>}
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-2xl font-bold text-gray-900">All Tasks</h2>
            <div className="flex gap-2">
              <button onClick={()=>setGrouped(g=>!g)} className={`px-3 py-1.5 text-sm rounded-lg border ${grouped?'bg-blue-50 border-blue-300 text-blue-700':'border-gray-300 text-gray-600 hover:bg-gray-50'}`}>{grouped?'Grouped':'Flat'}</button>
              <button onClick={()=>setModal('new')} className="px-4 py-1.5 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">+ New Task</button>
            </div>
          </div>
          <div className="flex flex-wrap gap-2 mb-4 p-3 bg-gray-50 rounded-xl border border-gray-200">
            {[{k:'status',opts:[['all','All'],['open','Open'],['done','Done']]},{k:'priority',opts:[['all','All Priority'],['high','High'],['normal','Normal'],['low','Low']]},{k:'due',opts:[['all','Any Date'],['overdue','Overdue'],['today','Today'],['this-week','This Week'],['none','No Date']]}].map(({k,opts})=>(
              <select key={k} className="border border-gray-300 rounded-lg px-2 py-1 text-sm text-gray-700 bg-white" value={filters[k]} onChange={e=>setFilters(f=>({...f,[k]:e.target.value}))}>
                {opts.map(([v,l])=><option key={v} value={v}>{l}</option>)}
              </select>
            ))}
            <select className="border border-gray-300 rounded-lg px-2 py-1 text-sm text-gray-700 bg-white" value={filters.category} onChange={e=>setFilters(f=>({...f,category:e.target.value}))}>
              <option value="all">All Categories</option>
              {state.categories.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
            <select className="border border-gray-300 rounded-lg px-2 py-1 text-sm text-gray-700 bg-white ml-auto" value={sort} onChange={e=>setSort(e.target.value)}>
              <option value="dueDate">Due Date</option><option value="created">Newest</option><option value="priority">Priority</option><option value="alpha">A–Z</option>
            </select>
          </div>
          <div className="text-xs text-gray-400 mb-2">{filtered.length} task{filtered.length!==1?'s':''}</div>
          {filtered.length===0?(
            <div className="text-center py-16 text-gray-400">
              <div className="text-4xl mb-3">📋</div>
              {state.tasks.length===0?<p>No tasks yet. Hit <strong>New Task</strong> to add your first one.</p>:<p>No tasks match your filters.</p>}
            </div>
          ):grouped&&byCategory?(
            <div className="space-y-6">
              {Object.entries(byCategory).map(([cat,tasks])=>(
                <div key={cat}>
                  <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1 px-1">{cat} · {tasks.length}</div>
                  <div className="rounded-xl border border-gray-200 overflow-hidden">{tasks.map(t=><TaskRow key={t.id} task={t} onEdit={setModal}/>)}</div>
                </div>
              ))}
            </div>
          ):(
            <div className="rounded-xl border border-gray-200 overflow-hidden">{filtered.map(t=><TaskRow key={t.id} task={t} onEdit={setModal}/>)}</div>
          )}
        </div>
      );
    }

    /* ── CATEGORIES ── */
    function Categories({onViewCategory}){
      const{state}=useStore();
      return(
        <div className="flex-1 p-6">
          <h2 className="text-2xl font-bold text-gray-900 mb-6">Categories</h2>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {state.categories.map(cat=>{
              const all=state.tasks.filter(t=>t.category===cat);
              const open=all.filter(t=>!t.done);
              const over=open.filter(t=>isOverdue(t.dueDate));
              const doneCount=all.filter(t=>t.done).length;
              const total=all.length;
              const pct=total>0?(doneCount/total)*100:0;
              const c=getColor(cat);
              return(
                <div key={cat} className="bg-white rounded-xl border border-gray-200 p-4 shadow-sm hover:shadow-md transition-shadow">
                  <div className="flex items-start justify-between mb-2">
                    <div><h3 className="font-semibold text-gray-900 text-sm">{cat}</h3><p className="text-xs text-gray-400 mt-0.5">{open.length} open</p></div>
                    <div className="flex gap-1.5 flex-wrap justify-end">
                      {over.length>0&&<span className="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-medium">{over.length} overdue</span>}
                      {open.length>20&&<span className="text-xs bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full font-medium">20+ tasks</span>}
                    </div>
                  </div>
                  {total>0&&(
                    <div className="mb-3">
                      <div className="flex justify-between text-xs text-gray-400 mb-1"><span>{doneCount} / {total} done</span><span>{Math.round(pct)}%</span></div>
                      <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden"><div className="h-full rounded-full transition-all duration-500" style={{width:`${pct}%`,backgroundColor:c.text}}/></div>
                    </div>
                  )}
                  <button onClick={()=>onViewCategory(cat)} className="w-full text-xs font-medium text-blue-600 hover:text-blue-800 py-1.5 bg-blue-50 hover:bg-blue-100 rounded-lg transition-colors">View tasks →</button>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    /* ── COMMITTEES ── */
    function EventModal({committee,event,onClose}){
      const{dispatch}=useStore();
      const isEdit=!!event;
      const[form,setForm]=useState({title:event?.title||'',date:event?.date||'',notes:event?.notes||''});
      const[err,setErr]=useState('');
      function submit(e){
        e.preventDefault();
        if(!form.title.trim()){setErr('Title is required');return;}
        if(!form.date){setErr('Date is required');return;}
        if(isEdit)dispatch({type:'UPDATE_COMMITTEE_EVENT',payload:{...event,...form}});
        else dispatch({type:'ADD_COMMITTEE_EVENT',payload:{committee,...form}});
        onClose();
      }
      return(
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40">
          <div className="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4">
            <div className="flex items-center justify-between px-6 py-4 border-b">
              <h2 className="text-lg font-semibold text-gray-900">{isEdit?'Edit Event':'Add Event'}</h2>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl">×</button>
            </div>
            <form onSubmit={submit} className="px-6 py-5 space-y-4">
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">Title *</label>
                <input autoFocus type="text" className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))}/>
                {err&&<p className="text-red-500 text-xs mt-1">{err}</p>}
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">Date *</label>
                <input type="date" className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/>
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                <textarea rows={2} className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))}/>
              </div>
              <div className="flex justify-end gap-3">
                <button type="button" onClick={onClose} className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg">Cancel</button>
                <button type="submit" className="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">{isEdit?'Save':'Add Event'}</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function CommitteeTabView({committee}){
      const{state,dispatch}=useStore();
      const[modal,setModal]=useState(null);
      const events=state.committeeEvents.filter(e=>e.committee===committee).sort((a,b)=>a.date.localeCompare(b.date));
      const upcoming=events.filter(e=>!e.done&&!isOverdue(e.date));
      const over=events.filter(e=>!e.done&&isOverdue(e.date));
      const completed=events.filter(e=>e.done);
      return(
        <div>
          {modal&&<EventModal committee={committee} event={modal==='add'?null:modal} onClose={()=>setModal(null)}/>}
          <div className="flex items-center justify-between mb-4">
            <div className="flex gap-4 text-sm">
              <span className="text-blue-600 font-medium">{upcoming.length} upcoming</span>
              {over.length>0&&<span className="text-red-600 font-medium">{over.length} overdue</span>}
              <span className="text-gray-400">{completed.length} completed</span>
            </div>
            <button onClick={()=>setModal('add')} className="px-3 py-1.5 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">+ Add Event</button>
          </div>
          {events.length===0?(
            <div className="text-center py-12 text-gray-400"><div className="text-4xl mb-3">📋</div><p>No events scheduled. Add your first milestone.</p></div>
          ):(
            <div className="divide-y divide-gray-100 rounded-xl border border-gray-200 overflow-hidden">
              {events.map(ev=>{
                const s=dueDateStatus(ev.date);
                const dc=ev.done?'text-gray-400':s==='overdue'?'text-red-600 font-medium':s==='today'?'text-amber-600 font-medium':'text-gray-600';
                return(
                  <div key={ev.id} className={`flex items-start gap-3 px-4 py-3 hover:bg-gray-50 group ${ev.done?'bg-gray-50':''}`}>
                    <input type="checkbox" checked={ev.done} onChange={()=>dispatch({type:'TOGGLE_EVENT_DONE',payload:ev.id})} className="mt-0.5 w-4 h-4 rounded border-gray-300 text-blue-600 cursor-pointer flex-shrink-0"/>
                    <div className="flex-1 min-w-0">
                      <div className={`text-sm font-medium ${ev.done?'line-through text-gray-400':'text-gray-900'}`}>{ev.title}</div>
                      {ev.notes&&<div className="text-xs text-gray-400 mt-0.5 truncate">{ev.notes}</div>}
                    </div>
                    <span className={`text-xs flex-shrink-0 ${dc}`}>{!ev.done&&s==='overdue'&&'⚠ '}{formatDisplay(ev.date)}</span>
                    <div className="flex gap-1 opacity-0 group-hover:opacity-100 flex-shrink-0">
                      <button onClick={()=>setModal(ev)} className="p-1 text-gray-400 hover:text-blue-600 text-sm">✏</button>
                      <button onClick={()=>{if(window.confirm('Delete this event?'))dispatch({type:'DELETE_COMMITTEE_EVENT',payload:ev.id});}} className="p-1 text-gray-400 hover:text-red-600 text-sm">🗑</button>

                  </div>
                );
              })}

          )}
        </div>
      );
    }

      return(

          <h2 className="text-2xl font-bold text-gray-900 mb-4">Committees</h2>
          <div className="flex gap-1 flex-wrap mb-6 border-b border-gray-200">
            {state.committees.map(c=>(
              <button key={c} onClick={()=>setActive(c)} className={`px-4 py-2.5 text-sm font-medium border-b-2 transition-colors whitespace-nowrap -mb-px ${active===c?'border-blue-600 text-blue-600':'border-transparent text-gray-500 hover:text-gray-700'}`}>{c}</button>

    /* ── CALENDAR / GANTT ── */
    function GanttCalendar(){
      const{state}=useStore();
      const[current,setCurrent]=useState(new Date());
      const[mode,setMode]=useState('calendar');
      const monthStart=calSOM(current);
      const monthEnd=calEOM(current);
      const days=calEachDay(calSOW(monthStart),calEOW(monthEnd));
      const tasksByDate=useMemo(()=>{
        const map={};
        state.tasks.forEach(t=>{if(!t.dueDate)return;if(!map[t.dueDate])map[t.dueDate]=[];map[t.dueDate].push({...t,_type:'task'});});
        state.committeeEvents.forEach(e=>{if(!map[e.date])map[e.date]=[];map[e.date].push({...e,_type:'event'});});
        return map;
      },[state.tasks,state.committeeEvents]);
      const allKeys=useMemo(()=>{const k=new Set();state.tasks.forEach(t=>k.add(t.category));state.committees.forEach(c=>k.add(c));return[...k];},[state.tasks,state.committees]);
      const daysInMonth=calDIM(current);
      const ganttTasks=useMemo(()=>{
        const ms=dateToISO(calSOM(current));
        const me=dateToISO(calEOM(current));
        return{inMonth:state.tasks.filter(t=>t.dueDate&&t.dueDate>=ms&&t.dueDate<=me),noDate:state.tasks.filter(t=>!t.dueDate)};
      },[state.tasks,current]);
      const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      return(
        <div className="flex-1 p-6 min-w-0">
          <div className="flex items-center justify-between mb-5">
            <div className="flex items-center gap-3">
              <button onClick={()=>setCurrent(c=>calAddMonths(c,-1))} className="p-2 text-gray-500 hover:bg-gray-100 rounded-lg">←</button>
              <h2 className="text-xl font-bold text-gray-900 min-w-[180px] text-center">{formatMonthYear(current)}</h2>
              <button onClick={()=>setCurrent(c=>calAddMonths(c,1))} className="p-2 text-gray-500 hover:bg-gray-100 rounded-lg">→</button>
              <button onClick={()=>setCurrent(new Date())} className="text-sm px-3 py-1.5 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50">Today</button>
            </div>
            <div className="flex rounded-lg border border-gray-300 overflow-hidden">
              <button onClick={()=>setMode('calendar')} className={`px-4 py-1.5 text-sm font-medium ${mode==='calendar'?'bg-blue-600 text-white':'text-gray-600 hover:bg-gray-50'}`}>Calendar</button>
              <button onClick={()=>setMode('gantt')} className={`px-4 py-1.5 text-sm font-medium ${mode==='gantt'?'bg-blue-600 text-white':'text-gray-600 hover:bg-gray-50'}`}>Gantt</button>
            </div>
          </div>
          {mode==='calendar'?(
            <>
              <div className="grid grid-cols-7 mb-1">{DOW.map(d=><div key={d} className="text-center text-xs font-semibold text-gray-400 py-2">{d}</div>)}</div>
              <div className="grid grid-cols-7 border-l border-t border-gray-200 rounded-lg overflow-hidden">
                {days.map(day=>{
                  const key=dateToISO(day);
                  const items=tasksByDate[key]||[];
                  const visible=items.slice(0,3);
                  const overflow=items.length-3;
                  return(
                    <div key={key} className={`min-h-[90px] border-r border-b border-gray-200 p-1.5 ${calSameMonth(day,current)?'bg-white':'bg-gray-50'}`}>
                      <div className={`text-xs font-medium w-6 h-6 flex items-center justify-center rounded-full mb-1 ${calIsToday(day)?'bg-blue-600 text-white':calSameMonth(day,current)?'text-gray-700':'text-gray-300'}`}>{day.getDate()}</div>
                      <div className="space-y-0.5">
                        {visible.map(item=>{
                          const k=item._type==='task'?item.category:item.committee;
                          const c=getColor(k||'');
                          return <div key={item.id} className="text-xs px-1.5 py-0.5 rounded truncate" style={{backgroundColor:c.bg,color:c.text}} title={`${item.title} — ${k}`}>{item.title}</div>;
                        })}
                        {overflow>0&&<div className="text-xs text-blue-500 px-1">+{overflow} more</div>}
                      </div>
                    </div>
                  );
                })}
              </div>
              {allKeys.length>0&&(
                <div className="mt-4 flex flex-wrap gap-2">
                  {allKeys.map(k=>{const c=getColor(k);return <span key={k} className="text-xs px-2 py-1 rounded-full" style={{backgroundColor:c.bg,color:c.text,border:`1px solid ${c.border}`}}>{k}</span>;})}
                </div>
              )}
            </>
          ):(
            <GanttView tasks={ganttTasks} daysInMonth={daysInMonth} monthStart={monthStart}/>
          )}
        </div>
      );
    }

    function GanttView({tasks,daysInMonth,monthStart}){
      const{inMonth,noDate}=tasks;
      const grouped=inMonth.reduce((acc,t)=>{if(!acc[t.category])acc[t.category]=[];acc[t.category].push(t);return acc;},{});
      const dayNums=Array.from({length:daysInMonth},(_,i)=>i+1);
      return(
        <div className="overflow-x-auto">
          <div className="min-w-[700px]">
            <div className="flex">
              <div className="w-44 shrink-0"/>
              <div className="flex-1 flex border-l border-t border-gray-200">
                {dayNums.map(d=>{
                  const date=new Date(monthStart.getFullYear(),monthStart.getMonth(),d);
                  return <div key={d} className={`flex-1 text-center text-xs py-1 border-r border-gray-200 ${calIsToday(date)?'bg-blue-50 font-bold text-blue-600':'text-gray-400'}`}>{d}</div>;
                })}
              </div>
            </div>
            {inMonth.length===0&&noDate.length===0?<div className="text-center py-12 text-gray-400">No tasks with due dates this month.</div>:(
              <>
                {Object.entries(grouped).map(([cat,catTasks])=>(
                  <div key={cat} className="flex border-t border-gray-200">
                    <div className="w-44 shrink-0 px-3 py-2 text-xs font-semibold text-gray-500 bg-gray-50 border-r border-gray-200 truncate">{cat}</div>
                    <div className="flex-1 relative" style={{height:`${catTasks.length*32}px`}}>
                      {dayNums.map(d=><div key={d} className="absolute top-0 bottom-0 border-r border-gray-100" style={{left:`${((d-1)/daysInMonth)*100}%`,width:`${100/daysInMonth}%`}}/>)}
                      {catTasks.map((t,i)=>{
                        const day=parseInt(t.dueDate.split('-')[2],10);
                        const c=getColor(t.category);
                        return(
                          <div key={t.id} className="absolute flex items-center gap-1" style={{top:`${i*32+6}px`,left:`${((day-1)/daysInMonth)*100}%`,height:'20px'}} title={`${t.title} — due ${t.dueDate}`}>
                            <div className="w-3 h-3 rotate-45 rounded-sm flex-shrink-0" style={{backgroundColor:c.text}}/>
                            <span className="text-xs text-gray-700 whitespace-nowrap max-w-[120px] truncate">{t.title}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
                {noDate.length>0&&(
                  <div className="border-t border-gray-200 flex">
                    <div className="w-44 shrink-0 px-3 py-2 text-xs font-semibold text-gray-400 bg-gray-50 border-r border-gray-200">No date</div>
                    <div className="flex-1 px-3 py-2 space-y-1">{noDate.map(t=><div key={t.id} className="text-xs text-gray-400 truncate">{t.title}</div>)}</div>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    /* ── SETTINGS ── */
    function Settings(){
      const{state,dispatch}=useStore();
      const[newCat,setNewCat]=useState('');
      const[newCom,setNewCom]=useState('');
      const[catErr,setCatErr]=useState('');
      const[comErr,setComErr]=useState('');
      const fileRef=useRef();
      function addCat(){const v=newCat.trim();if(!v)return;if(state.categories.includes(v)){setCatErr('Already exists');return;}dispatch({type:'ADD_CATEGORY',payload:v});setNewCat('');setCatErr('');}
      function delCat(c){if(state.tasks.some(t=>t.category===c)){setCatErr(`Cannot remove "${c}" — tasks use it`);return;}if(window.confirm(`Delete "${c}"?`))dispatch({type:'DELETE_CATEGORY',payload:c});}
      function addCom(){const v=newCom.trim();if(!v)return;if(state.committees.includes(v)){setComErr('Already exists');return;}dispatch({type:'ADD_COMMITTEE',payload:v});setNewCom('');setComErr('');}
      function delCom(c){if(state.committeeEvents.some(e=>e.committee===c)){setComErr(`Cannot remove "${c}" — events exist`);return;}if(window.confirm(`Delete "${c}"?`))dispatch({type:'DELETE_COMMITTEE',payload:c});}
      function exportData(){
        const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');a.href=url;a.download=`taskmanager-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);
      }
      function importData(e){
        const file=e.target.files[0];if(!file)return;
        const reader=new FileReader();
        reader.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!d.tasks||!d.categories){alert('Invalid file.');return;}if(window.confirm('Replace all data?'))dispatch({type:'IMPORT_DATA',payload:d});}catch{alert('Could not parse file.');}};
        reader.readAsText(file);e.target.value='';
      }
      return(
        <div className="flex-1 p-6 max-w-2xl">
          <h2 className="text-2xl font-bold text-gray-900 mb-6">Settings</h2>
          <Sec title="Categories">
            <div className="space-y-2 mb-3">
              {state.categories.map(c=><div key={c} className="flex items-center justify-between py-1.5 px-3 bg-gray-50 rounded-lg"><span className="text-sm text-gray-800">{c}</span><button onClick={()=>delCat(c)} className="text-xs text-red-400 hover:text-red-600">Remove</button></div>)}
            </div>
            {catErr&&<p className="text-red-500 text-xs mb-2">{catErr}</p>}
            <div className="flex gap-2">
              <input type="text" placeholder="New category" value={newCat} onChange={e=>{setNewCat(e.target.value);setCatErr('');}} onKeyDown={e=>e.key==='Enter'&&addCat()} className="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
              <button onClick={addCat} className="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">Add</button>
            </div>
          </Sec>
          <Sec title="Committees">
            <div className="space-y-2 mb-3">
              {state.committees.map(c=><div key={c} className="flex items-center justify-between py-1.5 px-3 bg-gray-50 rounded-lg"><span className="text-sm text-gray-800">{c}</span><button onClick={()=>delCom(c)} className="text-xs text-red-400 hover:text-red-600">Remove</button></div>)}
            </div>
            {comErr&&<p className="text-red-500 text-xs mb-2">{comErr}</p>}
            <div className="flex gap-2">
              <input type="text" placeholder="New committee" value={newCom} onChange={e=>{setNewCom(e.target.value);setComErr('');}} onKeyDown={e=>e.key==='Enter'&&addCom()} className="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
              <button onClick={addCom} className="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">Add</button>
            </div>
          </Sec>
          <Sec title="Data">
            <div className="space-y-3">
              <div className="flex gap-3">
                <button onClick={exportData} className="px-4 py-2 text-sm font-medium text-gray-700 border border-gray-300 hover:bg-gray-50 rounded-lg">⬇ Export JSON</button>
                <button onClick={()=>fileRef.current.click()} className="px-4 py-2 text-sm font-medium text-gray-700 border border-gray-300 hover:bg-gray-50 rounded-lg">⬆ Import JSON</button>
                <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={importData}/>
              </div>
              <div className="pt-2 border-t border-gray-100">
                <button onClick={()=>{if(window.confirm('Delete ALL data permanently?'))dispatch({type:'CLEAR_DATA'});}} className="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg">🗑 Clear All Data</button>
                <p className="text-xs text-gray-400 mt-1.5">Permanently deletes all tasks, events, and settings.</p>
              </div>
              <div className="text-xs text-gray-400 pt-1 border-t border-gray-100">{state.tasks.length} tasks · {state.committeeEvents.length} committee events</div>
            </div>
          </Sec>
        </div>
      );
    }
    function Sec({title,children}){return <div className="mb-8"><h3 className="text-base font-semibold text-gray-700 mb-3 pb-2 border-b border-gray-200">{title}</h3>{children}</div>;}

    /* ── APP ── */
    function AppInner(){
      const[view,setView]=useState('myday');
      const[catFilter,setCatFilter]=useState(null);
      const[showNew,setShowNew]=useState(false);
      function handleViewCat(cat){setCatFilter(cat);setView('alltasks');}
      function handleSetView(v){setView(v);if(v!=='alltasks')setCatFilter(null);}
      useEffect(()=>{
        function onKey(e){
          if(e.key==='n'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
            const tag=document.activeElement?.tagName?.toLowerCase();
            if(tag==='input'||tag==='textarea'||tag==='select')return;
            setShowNew(true);
          }
        }
        window.addEventListener('keydown',onKey);
        return()=>window.removeEventListener('keydown',onKey);
      },[]);
      return(
        <div className="flex h-screen bg-gray-50 overflow-hidden">
          <Sidebar view={view} setView={handleSetView}/>
          <main className="flex-1 overflow-y-auto flex flex-col">
            {view==='myday'&&<MyDay/>}
            {view==='alltasks'&&<AllTasks key={catFilter} initialCategory={catFilter}/>}
            {view==='categories'&&<Categories onViewCategory={handleViewCat}/>}
            {view==='committees'&&<Committees/>}
            {view==='gantt'&&<GanttCalendar/>}
            {view==='settings'&&<Settings/>}
          </main>
          {showNew&&<TaskModal task={null} onClose={()=>setShowNew(false)}/>}
        </div>
      );
    }
    function App(){return <StoreProvider><AppInner/></StoreProvider>;}
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
